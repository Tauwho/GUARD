# managed-by: guard-bootstrap v1
name: Bug
description: Something behaves differently from the contracts, the scenarios or the docs.
title: "bug: "
labels: ["type:bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: "Where does it happen?"
      options: ["host", "target", "both"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual"
    validations:
      required: true
  - type: input
    id: scenario_seed_mode
    attributes:
      label: "Scenario / seed / mode"
      placeholder: "e.g. F3 / 17 / B2"
  - type: input
    id: evidence_path
    attributes:
      label: "Evidence path"
      placeholder: "evidence/<yyyymmdd>-<sha7>-<topic>/"
