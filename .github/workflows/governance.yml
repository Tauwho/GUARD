name: governance
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/check_ownership.py --base "origin/${{ github.base_ref }}" --head-ref "${{ github.head_ref }}" --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}"
  contract-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: git fetch --tags --force origin
      - run: python tools/check_contract_compat.py --base contracts-v1.2
