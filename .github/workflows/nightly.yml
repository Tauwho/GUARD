name: nightly
on:
  schedule:
    - cron: "0 17 * * *"   # 01:00 SGT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fresh-clone-and-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 websockets==17.3 pytest==9.0.2 ruff==0.14.6
      - name: make check
        run: python tools/check.py
      - name: fresh clone demo
        run: bash tools/fresh_clone_demo.sh "${{ github.sha }}"
      - name: scope report
        run: python tools/scope_gate.py >> "$GITHUB_STEP_SUMMARY"
      - name: tag green
        run: |
          tag="green-$(TZ=Asia/Singapore date +%Y%m%d)"
          git tag -f "$tag" "${{ github.sha }}"
          git push -f origin "refs/tags/$tag"
