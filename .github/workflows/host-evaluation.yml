name: host-evaluation
on:
  push:
    branches: [main, a/135-linux-evaluation]
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per scenario/configuration (bounded host variation)
        type: choice
        options: ['1', '50']
        default: '1'
permissions:
  contents: read
concurrency:
  group: host-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - run: cmake --preset host-debug
      - run: cmake --build --preset host-debug --parallel 2
      - run: ctest --preset host-debug
      - run: cmake --preset host-release
      - run: cmake --build --preset host-release --parallel 2
      - name: Per-run replay time, one run at a time (B2, seed 1)
        shell: bash
        run: |
          mkdir -p out
          python eval/run_matrix.py --seeds 1 --modes B2 --gate-b2 --jobs 1 \
            --binary build/host-release/host/guard-replay-core --out out/linux-timing | tee out/timing.json
          echo "Slowest single B2 replay (F0-F8, seed 1, one run at a time): $(jq .max_replay_seconds out/timing.json) s on this host Linux runner." >> "$GITHUB_STEP_SUMMARY"
      - name: Execute matrix (errors and B2 regressions fail; controls remain visible)
        id: matrix
        shell: bash
        env:
          MATRIX_SEEDS: ${{ inputs.seeds || '1' }}
        run: |
          python eval/run_matrix.py --seeds "$MATRIX_SEEDS" --gate-b2 --jobs 4 \
            --binary build/host-release/host/guard-replay-core --out out/linux-matrix | tee out/matrix.json
          echo "Matrix: $(jq -c '{runs, errors, mismatched, wall_seconds, max_replay_seconds}' out/matrix.json) (4 parallel jobs)." >> "$GITHUB_STEP_SUMMARY"
      - name: Render report, including failed hypotheses
        if: always()
        run: |
          if test -f out/linux-matrix/results.json; then
            python eval/report.py out/linux-matrix/results.json --out out/linux-report
            cat out/linux-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain functional results and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-evaluation-${{ github.sha }}
          path: |
            out/linux-matrix/results.json
            out/linux-report/
          retention-days: 90
          if-no-files-found: warn
