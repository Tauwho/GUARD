name: host-ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: host-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [host-debug, host-asan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo CXX=g++ >> "$GITHUB_ENV"
          else
            echo CXX=clang++ >> "$GITHUB_ENV"
          fi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_format.py
  policy:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check: [core-portable, no-qnx-files, claims-lint, schemas, evidence]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Fetch PR heads (D21)
        if: matrix.check == 'evidence'
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pr/*'
      - run: python tools/check_policy.py ${{ matrix.check }}
  make-check:
    # `make check` itself on Linux, so every PR carries its full output as evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 websockets==17.3 pytest==9.0.2 ruff==0.14.6
      - run: git fetch --tags --force origin
      - run: python tools/check.py
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 ruff==0.14.6 PyYAML==6.0.3 jsonschema==4.26.0
      - run: python -m ruff check .
      - run: python -m pytest
