  - {id: A8, tier: STRETCH, owner: A, due: cut_2, title: "Hypothesis property tests (#28)", checks: [{grep: {file: "progress/A.md", re: "A8: done"}}]}
  - {id: A9, tier: STRETCH, owner: A, due: cut_2, title: "Live Ollama advisor path verified on a second laptop", checks: [{grep: {file: "progress/A.md", re: "A9: done"}}]}
  # ---------------- Stream B (target vertical) ----------------
  - {id: B1, tier: MUST, owner: B, due: cp1, title: "core-on-target evidence from main after A's core landed",
     checks: [{cmd: "python tools/scope_gate.py --check-core-evidence"}]}
  - {id: B2, tier: MUST, owner: B, due: cp1, title: "guard-gate process on target (resmgr /dev/guard/gate, C2/C3/C4/C5) with evidence",
