# MUST / SHOULD / STRETCH with executable done-checks and cut dates (SGT).
# tools/scope_gate.py evaluates every item against the current checkout and today's date:
#   DONE     - every check passes
#   OPEN     - not done, cut date not reached
#   DROPPED  - not done and the cut date for its tier has passed (SHOULD: cut_1, STRETCH: cut_2)
#   AT-RISK  - MUST item not done after its due date (the fallback in "fallback" applies automatically)
# Check kinds: file (glob must match), grep (regex must match in a file), cmd (exit 0).
version: 1
dates:
  cp1: 2026-11-22T23:59
  cp2: 2026-11-29T23:59
  cut_1: 2026-12-04T23:59      # SHOULD items not DONE and with no branch activity are DROPPED
  cut_2: 2026-12-07T23:59      # every STRETCH item not DONE is DROPPED
  feature_freeze: 2026-12-09T23:59
  code_freeze: 2026-12-10T18:00
  hard_stop: 2026-12-15T18:00
items:
  # ---------------- Stream A (host vertical) ----------------
  - {id: A1, tier: MUST, owner: A, due: cp1, title: "Open review blockers fixed in core (lease_seq on refusal, recheck uses lease length and speed bounds only)",
     checks: [{cmd: "python -m pytest eval/tests -q -k 'not slow'"}, {grep: {file: "progress/A.md", re: "A1: done"}}]}
  - {id: A2, tier: MUST, owner: A, due: cp1, title: "Planner fixes: F5 keeps a_max ramp and retries at nominal speed; F6 shortcut cites cached map version",
     checks: [{grep: {file: "progress/A.md", re: "A2: done"}}]}
  - {id: A3, tier: MUST, owner: A, due: cp1, title: "Host side of the target scenario runner, local mock target (eval/target_runner.py --target local)",
     checks: [{file: "eval/target_runner.py"}, {file: "eval/tests/test_target_runner.py"}]}
  - {id: A4, tier: MUST, owner: A, due: cp2, title: "Linux host matrix (B0/B1/B2 + ablations) published as a CI artifact on main, report labelled host (Linux) harness",
     checks: [{grep: {file: "progress/A.md", re: "A4: done .*actions/runs/[0-9]+"}}]}
  - {id: A5, tier: MUST, owner: A, due: cp2, title: "Dashboard replay final (lease bar, arc, reason feed) + headless smoke test",
     checks: [{file: "eval/tests/test_dashboard_relay.py"}, {grep: {file: "progress/A.md", re: "A5: done"}}]}
  - {id: A6, tier: SHOULD, owner: A, due: cut_1, title: "LLM route advisor demo on host with recorded responses (Qwen2.5-1.5B, D23)",
     checks: [{grep: {file: "host/ADVISOR.md", re: "1\\.5[bB]"}}, {grep: {file: "progress/A.md", re: "A6: done"}}]}
  - {id: A7, tier: SHOULD, owner: A, due: cut_1, title: "Seeds perturb world/planner so 50 seeds are independent trials (or report says deterministic repeats)",
