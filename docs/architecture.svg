<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">GUARD architecture</title>
  <desc id="d">Separate processes on the QNX target: an untrusted planner proposes motion to the supervisor, which checks it against its own observations and grants a short epoch-fenced lease to the gate. The gate drives the simulator only under a live lease and stops on its own timer. The bridge streams C8 telemetry to a read-only dashboard on the host; the host harness replays the same core in virtual time.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .trust { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .key { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
    .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 3; }
    .h { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 12px; fill: #334155; }
    .l { font-size: 12px; fill: #0f172a; }
    .z { font-size: 12px; font-weight: 700; fill: #475569; }
    .e { stroke: #334155; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="560" fill="#ffffff"/>

  <rect class="zone" x="20" y="20" width="920" height="390" rx="8"/>
  <text class="z" x="36" y="42">Design, QNX 8.0 target in QEMU: one process per box (docs/architecture.md); evidence in README Evidence Map</text>
  <rect class="zone" x="20" y="425" width="920" height="115" rx="8"/>
  <text class="z" x="924" y="447" text-anchor="end">Host (Linux or WSL2)</text>

  <rect class="trust" x="50" y="70" width="210" height="90" rx="6"/>
  <text class="h" x="155" y="100" text-anchor="middle">Planner</text>
  <text class="s" x="155" y="122" text-anchor="middle">untrusted, prio 10</text>
  <text class="s" x="155" y="140" text-anchor="middle">only proposes motion</text>

  <rect class="box" x="375" y="70" width="210" height="90" rx="6"/>
  <text class="h" x="480" y="100" text-anchor="middle">Supervisor</text>
  <text class="s" x="480" y="122" text-anchor="middle">own observation history, checks 1-11</text>
  <text class="s" x="480" y="140" text-anchor="middle">monitor prio 30, C1 server inherits 10</text>

  <rect class="key" x="700" y="70" width="210" height="90" rx="6"/>
  <text class="h" x="805" y="100" text-anchor="middle">Gate</text>
  <text class="s" x="805" y="122" text-anchor="middle">own timer stops on lease expiry</text>
  <text class="s" x="805" y="140" text-anchor="middle">tick + expiry prio 35; resmgr inherits</text>

  <rect class="box" x="375" y="290" width="210" height="90" rx="6"/>
  <text class="h" x="480" y="320" text-anchor="middle">Simulator</text>
  <text class="s" x="480" y="342" text-anchor="middle">robot + hospital world, prio 40</text>
  <text class="s" x="480" y="360" text-anchor="middle">obeys the gate's motor commands</text>

  <rect class="box" x="50" y="290" width="210" height="90" rx="6"/>
  <text class="h" x="155" y="320" text-anchor="middle">Bridge</text>
  <text class="s" x="155" y="342" text-anchor="middle">prio 8, reads the telemetry ring</text>
  <text class="s" x="155" y="360" text-anchor="middle">C8 telemetry out only</text>

  <rect class="box" x="700" y="290" width="210" height="90" rx="6"/>
  <text class="h" x="805" y="320" text-anchor="middle">guardctl</text>
  <text class="s" x="805" y="342" text-anchor="middle">operator: status, recover,</text>
  <text class="s" x="805" y="360" text-anchor="middle">inject via C7 (test image)</text>

  <rect class="box" x="50" y="460" width="210" height="65" rx="6"/>
  <text class="h" x="155" y="487" text-anchor="middle">Dashboard</text>
  <text class="s" x="155" y="508" text-anchor="middle">read-only, loopback only</text>

  <rect class="box" x="375" y="460" width="210" height="65" rx="6"/>
  <text class="h" x="480" y="487" text-anchor="middle">guard-replay</text>
  <text class="s" x="480" y="508" text-anchor="middle">same core, virtual time</text>

  <path class="e" marker-end="url(#a)" d="M260 100 H373"/>
  <text class="l" x="316" y="92" text-anchor="middle">C1 proposal</text>
  <path class="e" marker-end="url(#a)" d="M375 135 H262"/>
  <text class="l" x="316" y="153" text-anchor="middle">decision + reason</text>

  <path class="e" marker-end="url(#a)" d="M585 115 H698"/>
  <text class="l" x="641" y="107" text-anchor="middle">C2 lease</text>
  <text class="l" x="641" y="133" text-anchor="middle">(epoch, expiry)</text>

  <path class="e" marker-end="url(#a)" d="M760 160 L590 300"/>
  <text class="l" x="668" y="222" text-anchor="end">C5 motor command</text>
  <text class="l" x="668" y="238" text-anchor="end">(stop when no lease)</text>

  <path class="e" marker-end="url(#a)" d="M480 290 V162"/>
  <text class="l" x="472" y="230" text-anchor="end">C6 observations</text>

  <path class="e" marker-end="url(#a)" d="M375 310 L240 162"/>
  <text class="l" x="205" y="238" text-anchor="middle">C6 own feed</text>

  <path class="e" marker-end="url(#a)" d="M785 290 V162"/>
  <text class="l" x="777" y="230" text-anchor="end">C3 recover</text>
  <path class="e" marker-end="url(#a)" d="M825 162 V288"/>
  <text class="l" x="833" y="230">C4 status</text>

  <path class="e" marker-end="url(#a)" d="M375 360 H262"/>
  <text class="l" x="318" y="378" text-anchor="middle">telemetry ring</text>
  <text class="l" x="318" y="394" text-anchor="middle">(all processes)</text>

  <path class="e" marker-end="url(#a)" d="M155 380 V458"/>
  <text class="l" x="163" y="402">C8 JSONL, TCP 7700</text>

  <path class="e" marker-end="url(#a)" d="M375 492 H262"/>
  <text class="l" x="318" y="484" text-anchor="middle">C8 trace</text>

  <text class="s" x="605" y="487">Simulation-only research prototype.</text>
  <text class="s" x="605" y="505">C1-C8: docs/architecture.md REF-CONTRACTS</text>
</svg>
